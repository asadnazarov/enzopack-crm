name: EnzoPack daily Telegram report

on:
  schedule:
    # 15:00 UTC = 20:00 Ташкент (UTC+5, круглый год без перехода на летнее время)
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Call Supabase Edge Function
        run: |
          curl -fsS -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/daily-report" \
            -H "Authorization: Bearer ${{ secrets.FUNCTION_SHARED_SECRET }}" \
            -H "Content-Type: application/json"
